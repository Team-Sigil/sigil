[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-layer"
version = "0.1.0"
description = "Agentic AI layer of the Sigil delegated financial guardianship platform"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.15",
    "pydantic>=2.9",
    "httpx>=0.27",
    "fastapi>=0.115",
    "apscheduler>=3.10,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "uvicorn>=0.30"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "live: calls the real Anthropic API (deselected by default; run with -m live)",
]
addopts = "-m 'not live'"
