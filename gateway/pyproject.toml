[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sigil-gateway"
version = "0.1.0"
description = "Gateway layer of the Sigil delegated financial guardianship platform"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "base58>=2.1.1",
    "cryptography>=50.0.2",
    "fastapi>=0.143.3",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "pyjwt>=2.15.1",
    "pynacl>=1.6.2",
    "sqlalchemy[asyncio]>=2.1.5",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.md"]

[tool.ruff.format]
exclude = ["src/gateway/contracts/agent.py", "src/gateway/money.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "RUF", "ASYNC", "DTZ", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"src/gateway/db/migrations/versions/**" = ["E501"]
# Verbatim copies from the agent layer; kept byte-identical.
"src/gateway/contracts/agent.py" = ["E501", "RUF012", "UP037"]
"src/gateway/money.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
